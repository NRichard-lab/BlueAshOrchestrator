name: Harness release feeds

# Queries every vendor feed and package registry the harness update advisory
# reads. Vendors change these endpoints without notice and the unit tests only
# see fakes, so a daily live run surfaces a broken feed before users see an
# "unknown" update status.
#
# BlueAshAI compiles the harness update advisory out (brands.json updatesEnabled=false),
# so nothing in the shipped product reads these feeds and this job has no reason to hit
# vendor hosts on a schedule or on every PR. It is manual-only (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-feeds:
    # Forks inherit the schedule but nobody watches their runs.
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Query live release feeds
        env:
          AO_LIVE_HARNESS_FEEDS: "1"
        run: go test -count=1 -run '^TestLiveHarnessReleaseFeeds$' -v ./internal/service/systeminstall
