# .github/workflows/build-artifacts.yml
name: Desktop build artifacts

# Dispatchable unsigned desktop build for an external release conductor.
# Builds the Electron app for the selected platforms (the first BlueAsh release
# is Windows x64 only; see the `platforms` input) at a pinned ref with a
# caller-supplied version, uploads each installer as a short-lived run
# artifact, and emits a digests.json artifact (a flat JSON object mapping
# each artifact filename to its sha256 hex string) that the conductor reads
# to verify hashes before signing. Creates no release, references no secrets.
# macOS output is intentionally UNSIGNED: forge.config.ts only activates
# osxSign/osxNotarize when the Apple env vars are present, and this workflow
# never sets them (no macos-signing-setup). The conductor signs downstream.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to build"
        type: string
        required: true
      version:
        description: "Version string to stamp into the app"
        type: string
        required: true
      platforms:
        description: 'Platforms to build: empty = win32-x64 (first release is Windows only), "all", or a comma list such as "win32-x64,linux-x64"'
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}
  # Teams: unset (the default) gives it to nightly builds only; the repository
  # variable set to "on" gives it to stable builds too, "off" to none. Any other
  # value stops the build (frontend/src/shared/teams-flag.ts).
  VITE_AO_TEAMS: ${{ vars.VITE_AO_TEAMS }}

jobs:
  # Decides which platforms build. Every platform stays defined in
  # frontend/scripts/select-release-platforms.mjs; the default is Windows only
  # because macOS and Linux desktop testing is deferred for the first release.
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: frontend/scripts/select-release-platforms.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: pick
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: node frontend/scripts/select-release-platforms.mjs "$PLATFORMS"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      # The daemon is compiled by build-daemon.mjs during premake, so the Go
      # toolchain must be present and pinned on every runner.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui
      - name: Verify WorkOS build configuration
        shell: bash
        run: |
          if [ -z "$VITE_WORKOS_CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_WORKOS_CLIENT_ID is required for desktop artifacts." >&2
            exit 1
          fi
      # Stamp the conductor-supplied version into package.json for this build,
      # dropping any +build metadata.
      - name: Stamp version
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          node -e "const v=process.env.BUILD_VERSION.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"
      # Electron 44's V8 headers put [[deprecated]] before __attribute__ in a
      # class head, which Ubuntu 22.04's GCC 11 rejects when node-gyp rebuilds
      # better-sqlite3, and need std::source_location, which 22.04's libstdc++
      # offers only to a compiler with __builtin_source_location (clang 15+;
      # the runner's default clang is 14). Only C++ changes, so tmux and every
      # C build keep GCC, and the 22.04 libstdc++ and glibc baseline stays.
      - name: Use clang++-15 for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v clang++-15
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
      - name: Require the BlueAsh update origin
        # There is no default update origin and no upstream fallback: forge.config.ts
        # refuses to package without a valid AO_UPDATE_ORIGIN. Fail here with a
        # clear message instead of deep inside the package step.
        shell: bash
        env:
          AO_UPDATE_ORIGIN: ${{ vars.AO_UPDATE_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -z "${AO_UPDATE_ORIGIN:-}" ]; then
            echo "::error::Repository variable AO_UPDATE_ORIGIN is not set. Set it to the BlueAsh update server origin (https://<host>) before building." >&2
            exit 1
          fi
          node scripts/verify-update-origin.mjs origin "$AO_UPDATE_ORIGIN"
      - name: Build (unsigned, no publish)
        shell: bash
        env:
          # Baked into app-update.yml as the generic-provider feed
          # ({origin}/desktop/stable/). AO_RELEASE_REPO is intentionally unset:
          # it only selects an optional GitHub publisher and never the feed.
          AO_UPDATE_ORIGIN: ${{ vars.AO_UPDATE_ORIGIN }}
          # Production product profile (frontend/src/shared/brands.json): BlueAshAI name, state dir,
          # port, protocol scheme, installer and asset names. Compiled in; also stamps the Go daemon.
          AO_BRAND: blueashai
          # Marks a published build: Electron main may initialize Sentry, and
          # Vite emits hidden source maps with Sentry debug IDs (vite.sentry.ts).
          # The maps are left out of the package and uploaded below.
          AO_PUBLISHED_BUILD: "1"
        run: npm run make
      - name: Verify baked update feed
        # app-update.yml is what electron-updater reads at runtime; forge's
        # prePackage hook writes it to the working dir and ships it via
        # extraResource. Assert it is the generic provider on exactly the
        # configured BlueAsh origin, then scan the packaged output for any
        # upstream release/update URL (plan checkpoints C8/C9).
        shell: bash
        env:
          AO_UPDATE_ORIGIN: ${{ vars.AO_UPDATE_ORIGIN }}
        run: |
          set -euo pipefail
          node scripts/verify-update-origin.mjs yml app-update.yml --origin "$AO_UPDATE_ORIGIN"
          node scripts/verify-update-origin.mjs app out --origin "$AO_UPDATE_ORIGIN"
      - name: Collect artifact and compute digest
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist-artifact
          case "$PLATFORM" in
            darwin-*)
              # maker-zip output: out/make/zip/darwin/<arch>/<name>-<version>.zip
              src="$(find out/make/zip/darwin -name '*.zip' | head -n1)"
              name="agent-orchestrator-$PLATFORM.zip"
              ;;
            win32-x64)
              # NSIS (electron-builder) output: out/make/<productName> Setup <version>.exe
              src="$(find out/make -maxdepth 1 -name '*Setup*.exe' | head -n1)"
              name="BlueAshAI-win32-x64.exe"
              ;;
            linux-x64)
              # AppImage (electron-builder) output: out/make/<productName>-<version>.AppImage
              src="$(find out/make -maxdepth 1 -name '*.AppImage' | head -n1)"
              name="agent-orchestrator-linux-x64.AppImage"
              ;;
            *)
              echo "unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
          if [ -z "$src" ]; then echo "no build output found for $PLATFORM" >&2; exit 1; fi
          cp "$src" "dist-artifact/$name"
          hash="$(openssl dgst -sha256 "dist-artifact/$name" | awk '{print $NF}')"
          # Pinned digest contract: a flat filename -> sha256 hex map, merged
          # into one digests.json by the digests job below.
          jq -n --arg f "$name" --arg h "$hash" \
            '{($f): $h}' > "dist-artifact/$PLATFORM.digest.json"
          echo "$PLATFORM: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
      # The deb maker in forge.config.ts also runs on linux; capture its output
      # as a separate `linux-deb` artifact. It lives in its own dist-deb dir so
      # the `linux` artifact's agent-orchestrator-linux-x64.* glob below cannot
      # pick it up. Its digest is merged into the linux-x64 digest fragment so
      # the digests job still reads one fragment per platform.
      - name: Collect Linux .deb and compute digest
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist-deb
          # maker-deb output: out/make/deb/x64/<name>_<version>_amd64.deb
          src="$(find out/make -name '*.deb' | head -n1)"
          if [ -z "$src" ]; then echo "no .deb output found" >&2; exit 1; fi
          name="agent-orchestrator-linux-x64.deb"
          cp "$src" "dist-deb/$name"
          hash="$(openssl dgst -sha256 "dist-deb/$name" | awk '{print $NF}')"
          jq --arg f "$name" --arg h "$hash" '. + {($f): $h}' \
            dist-artifact/linux-x64.digest.json > dist-artifact/linux-x64.digest.json.tmp
          mv dist-artifact/linux-x64.digest.json.tmp dist-artifact/linux-x64.digest.json
          echo "linux-x64: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux .deb artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: frontend/dist-deb/agent-orchestrator-linux-x64.deb
          retention-days: 1
          if-no-files-found: error
      # Same story for the rpm maker (Fedora/RHEL/openSUSE, issue #3405). It
      # already runs here (ubuntu-22.04 ships rpmbuild), its output was just
      # never collected. Own dir for the same reason as the deb: keep it out of
      # the `linux` artifact's agent-orchestrator-linux-x64.* glob.
      - name: Collect Linux .rpm and compute digest
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist-rpm
          # maker-rpm output: out/make/rpm/x64/<name>-<version>-<revision>.x86_64.rpm
          src="$(find out/make -name '*.rpm' | head -n1)"
          if [ -z "$src" ]; then echo "no .rpm output found" >&2; exit 1; fi
          name="agent-orchestrator-linux-x64.rpm"
          cp "$src" "dist-rpm/$name"
          hash="$(openssl dgst -sha256 "dist-rpm/$name" | awk '{print $NF}')"
          jq --arg f "$name" --arg h "$hash" '. + {($f): $h}' \
            dist-artifact/linux-x64.digest.json > dist-artifact/linux-x64.digest.json.tmp
          mv dist-artifact/linux-x64.digest.json.tmp dist-artifact/linux-x64.digest.json
          echo "linux-x64: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux .rpm artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: frontend/dist-rpm/agent-orchestrator-linux-x64.rpm
          retention-days: 1
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/dist-artifact/*-${{ matrix.platform }}.*
          retention-days: 1
          if-no-files-found: error
      # The conductor uploads these to the ao-electron Sentry project with
      # `sentry-cli sourcemaps upload`; debug IDs match them to the shipped
      # bundles. This workflow holds no Sentry token.
      - name: Upload Sentry source maps
        uses: actions/upload-artifact@v4
        with:
          name: sentry-sourcemaps-${{ matrix.platform }}
          path: |
            frontend/.vite/build/*.js
            frontend/.vite/build/*.js.map
            frontend/.vite/renderer/main_window/assets/*.js
            frontend/.vite/renderer/main_window/assets/*.js.map
          if-no-files-found: error
          retention-days: 1
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: frontend/dist-artifact/${{ matrix.platform }}.digest.json
          retention-days: 1
          if-no-files-found: error

  # Merge the per-platform digest fragments into one digests.json artifact so
  # a downstream consumer reads every expected hash from a single file.
  digests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Merge digests
        shell: bash
        run: |
          jq -s 'add' ./*.digest.json > digests.json
          { echo '### Artifact digests'; echo '```json'; cat digests.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: digests.json
          retention-days: 1
          if-no-files-found: error
